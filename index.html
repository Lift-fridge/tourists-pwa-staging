<!DOCTYPE html>

<head>

  <script src="./mobile-share-qr-code.js?pwa=staging-677f324" defer></script>

</head>
<body>
  <main class="mobile-home-card">
    <section id="mobile-cover" class="mobile-cover" aria-labelledby="mobile-cover-title" hidden>
      <button type="button" id="mobile-cover-saved-trips-show" class="mobile-cover-brand" aria-label="保存した旅行一覧を開く">旅のしおり</button>
      <div class="mobile-cover-content">
        <h1 id="mobile-cover-title"></h1>
        <p id="mobile-cover-destination" class="mobile-cover-destination" hidden></p>
        <p id="mobile-cover-dates" class="mobile-cover-dates"></p>
        <p id="mobile-cover-saved-at" class="mobile-cover-saved-at" hidden></p>
      </div>
      <div class="mobile-cover-footer" aria-hidden="true">
        <img class="mobile-cover-ornament" src="./assets/mobile-clover.svg?pwa=staging-677f324" alt="">
        <p class="mobile-cover-swipe"><span>↑</span> 上へスワイプして旅をはじめる</p>
      </div>
    </section>
    <section id="mobile-trip-content">
      <p class="mobile-home-eyebrow">旅のしおり</p>
      <h1 id="mobile-home-trip-title">旅のしおり</h1>
      <p id="mobile-home-trip-dates" class="mobile-home-dates" hidden></p>
      <p id="mobile-home-message" role="status" aria-live="polite">保存した旅のしおりを読み込んでいます…</p>
      <section id="mobile-itinerary" class="mobile-itinerary" aria-label="旅程" hidden>
        <header class="mobile-itinerary-header">
          <nav class="mobile-itinerary-tabs" aria-label="しおりの画面">
            <button type="button" id="mobile-itinerary-tab-info" class="mobile-itinerary-tab" aria-controls="mobile-itinerary-days">詳細</button>
            <button type="button" id="mobile-itinerary-tab-itinerary" class="mobile-itinerary-tab mobile-itinerary-tab-current" aria-controls="mobile-itinerary-days" aria-current="page">旅程</button>
            <button type="button" id="mobile-itinerary-tab-memo" class="mobile-itinerary-tab" aria-controls="mobile-itinerary-days">メモ</button>
          </nav>
          <nav id="mobile-itinerary-date-nav" class="mobile-itinerary-date-nav" aria-label="日付ナビゲーション"></nav>
        </header>
        <div id="mobile-itinerary-days" class="mobile-itinerary-days"></div>
      </section>
    </section>
    <section id="mobile-saved-trip-list" class="mobile-saved-trip-list" aria-labelledby="mobile-saved-trip-list-heading" hidden>
      <div class="mobile-saved-trip-list-heading">
        <h2 id="mobile-saved-trip-list-heading">旅のしおり</h2>
      </div>
      <div class="mobile-saved-trip-receive">
        <button type="button" id="mobile-saved-trip-receive-show">
          <svg class="mobile-saved-trip-receive-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 3.5h6v6h-6zm11 0h6v6h-6zm-11 11h6v6h-6zm8 0h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 0h2v2h-2zm4-4h1v6h-6v-1h5z"/></svg>
          <span class="mobile-saved-trip-receive-label">旅行を受け取る</span>
          <span class="mobile-saved-trip-receive-arrow" aria-hidden="true">›</span>
        </button>
        <section id="mobile-saved-trip-qr-scanner" class="mobile-saved-trip-qr-scanner" aria-labelledby="mobile-saved-trip-qr-scanner-heading" hidden>
          <div class="mobile-saved-trip-qr-scanner-content">
            <h2 id="mobile-saved-trip-qr-scanner-heading">QRコードを読み取る</h2>
            <video id="mobile-saved-trip-qr-scanner-video" autoplay muted playsinline></video>
            <canvas id="mobile-saved-trip-qr-scanner-canvas" hidden></canvas>
            <p id="mobile-saved-trip-qr-scanner-status" role="status" aria-live="polite"></p>
            <button type="button" id="mobile-saved-trip-qr-scanner-close">閉じる</button>
          </div>
        </section>
      </div>
      <p id="mobile-saved-trip-list-status" role="status" aria-live="polite"></p>
      <div id="mobile-saved-trip-list-items"></div>
      <section id="mobile-saved-trip-share" class="mobile-saved-trip-share" aria-labelledby="mobile-saved-trip-share-heading" hidden>
        <div class="mobile-saved-trip-share-content" role="dialog" aria-modal="true">
          <h2 id="mobile-saved-trip-share-heading">旅行を共有</h2>
          <p id="mobile-saved-trip-share-trip" class="mobile-saved-trip-share-trip"></p>
          <p id="mobile-saved-trip-share-status" role="status" aria-live="polite"></p>
          <div id="mobile-saved-trip-share-confirm" class="mobile-saved-trip-share-step">
            <p>この旅行を作成した人のメールアドレスに、確認コードを送信します。</p>
            <button type="button" id="mobile-saved-trip-share-send">確認コードを送信</button>
          </div>
          <div id="mobile-saved-trip-share-verify" class="mobile-saved-trip-share-step" hidden>
            <label for="mobile-saved-trip-share-otp">6桁の確認コード</label>
            <input id="mobile-saved-trip-share-otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
            <button type="button" id="mobile-saved-trip-share-verify-button">確認してQRを表示</button>
          </div>
          <div id="mobile-saved-trip-share-qr" class="mobile-saved-trip-share-qr" hidden>
            <p>このQRコードは10分間有効です。受け取る端末で読み取ってください。</p>
            <div id="mobile-saved-trip-share-qr-code"></div>
          </div>
          <button type="button" id="mobile-saved-trip-share-close" class="mobile-saved-trip-share-close">閉じる</button>
        </div>
      </section>
      <p id="mobile-staging-build" class="mobile-staging-build" data-staging-build-id="677f324" data-staging-pwa-version="v114" aria-label="STAGING build ID">STAGING · 677f324 · PWA --</p>
    </section>
    <section id="mobile-pwa-diagnostics" class="mobile-pwa-diagnostics" aria-labelledby="mobile-pwa-diagnostics-heading" hidden>
      <button type="button" id="mobile-pwa-diagnostics-show">PWA診断を表示</button>
      <pre id="mobile-pwa-diagnostics-result" hidden aria-live="polite"></pre>
    </section>
  </main>
</body>
</html>
