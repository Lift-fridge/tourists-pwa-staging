<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V1.1 Dock 画像選択テスト</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;max-width:520px;margin:0 auto;padding:25px 18px 40px;background:#f6f6f4;color:#2a2925}
h1{font-size:21px}p{line-height:1.6}.note{font-size:13px;color:#716d65}.panel{background:white;border:1px solid #d6d6d1;border-radius:13px;padding:18px;margin:18px 0}
input[type=file]{max-width:100%;font-size:15px}label{display:block;margin-bottom:9px}button{font-size:15px;border:1px solid #b7bcb2;background:#f9faf8;padding:12px;border-radius:8px}
.dock{display:flex;justify-content:center;gap:4px;margin:22px auto}.item{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;min-width:78px}.icon{width:62px;height:62px;object-fit:cover;border-radius:15px;background:#e7e9e4;border:1px solid #b3b8af}.item span{display:block;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:11px}
#status{font-size:13px;word-break:break-word}
</style></head>
<body>
<h1>V1.1 Dock｜画像選択テスト</h1>
<p class="note">STAGING専用。写真アプリに保存したANAのアイコンを選んでください。画像はブラウザ内で一時表示するだけで、アップロード・保存・送信しません。</p>
<section class="panel">
<label for="icon-file">アイコン画像を選択</label>
<input type="file" id="icon-file" accept="image/*">
<p id="status" role="status">まだ画像を選択していません。</p>
</section>
<section class="panel">
<strong>Dockの表示イメージ</strong>
<div class="dock">
<div class="item"><img class="icon" id="app-icon" alt="選択したアプリアイコン"><span>ANA</span></div>
<div class="item"><div class="icon" style="display:grid;place-items:center;font-size:26px">＋</div><span>追加</span></div>
</div>
<button id="reset" type="button">選択を取り消す</button>
</section>
<p class="note">このテストで使用した画像はページを閉じると失われます。旅行データ、Supabase、TOURISTS本体には影響しません。</p>
<script>
'use strict';
const input=document.getElementById('icon-file'),img=document.getElementById('app-icon'),status=document.getElementById('status');
let current=null;
function clear(){if(current){URL.revokeObjectURL(current);current=null}img.removeAttribute('src');input.value='';status.textContent='まだ画像を選択していません。'}
input.addEventListener('change',()=>{
 if(current){URL.revokeObjectURL(current);current=null}
 const f=input.files?.[0];if(!f){clear();return}
 if(!f.type.startsWith('image/')){clear();status.textContent='画像ファイルを選んでください。';return}
 if(f.size>8*1024*1024){clear();status.textContent='8MB以下の画像を選んでください。';return}
 current=URL.createObjectURL(f);img.src=current;status.textContent='アイコンを表示しました。';
});
document.getElementById('reset').addEventListener('click',clear);
window.addEventListener('pagehide',()=>{if(current)URL.revokeObjectURL(current)});
</script>
</body></html>
