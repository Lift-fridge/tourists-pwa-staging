<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dock V1.1 表紙デザイン確認</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#2a2925;background:#e9e8e2}*{box-sizing:border-box}body{margin:0}.preview{max-width:440px;margin:0 auto;height:100svh;min-height:580px;position:relative;background:#f6f6f4 url('../assets/mobile-cover.png') center/cover no-repeat;overflow:hidden}.preview:before{content:"";position:absolute;inset:0;background:rgba(246,246,244,.88)}.contents{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:34px 28px 28px}.brand{text-align:center;font-size:11px;font-weight:600;letter-spacing:.18em;color:#716d65}.center{align-self:center;text-align:center;transform:translateY(-7vh)}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(34px,10vw,46px);line-height:1.32;margin:0}.destination{font-size:12px;letter-spacing:.22em;color:#716d65;margin:15px 0 0}.dates{font-size:14px;margin:21px 0 0}.dock{display:flex;justify-content:center;gap:20px;margin-top:48px;align-items:flex-start;overflow-x:auto;padding:4px 0 10px}.dock-item{border:0;background:none;display:grid;justify-items:center;gap:6px;min-width:54px;flex:0 0 auto;color:#4d5548;font-size:11px;cursor:pointer}.dock-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;border:1px solid rgba(106,120,100,.34);background:rgba(255,255,255,.46);font-size:23px}.footer{text-align:center;color:#716d65;font-size:12px}.footer .ornament{display:block;color:#587d5a;font-size:16px}dialog{width:min(94vw,385px);border:1px solid #d6d6d1;border-radius:16px;padding:20px;background:#fafaf9;color:#2a2925;box-shadow:0 18px 65px #0004}dialog::backdrop{background:#0005}dialog h2{margin:0 0 18px;font-size:17px}dialog button{display:block;width:100%;text-align:left;margin:9px 0;background:white;border:1px solid #d6d6d1;border-radius:10px;padding:15px;font-size:15px}dialog button.close{text-align:center;background:#eee}.hint{font-size:12px;color:#716d65;line-height:1.6;margin-bottom:0}.toggle{position:absolute;top:66px;right:16px;z-index:2;font-size:11px;padding:8px 10px;border:1px solid #bcb8ae;border-radius:20px;background:#ffffffbb;color:#444}
</style></head><body>
<main class="preview"><button class="toggle" id="toggle">未登録の表示を見る</button><div class="contents"><div class="brand">旅のしおり</div><div class="center"><h1>ロンドン旅行</h1><p class="destination">LONDON</p><p class="dates">2027.05.01 — 2027.05.06</p><nav class="dock" id="dock"></nav></div><div class="footer"><span class="ornament">♧</span>↑ 上へスワイプして旅をはじめる</div></div></main>
<dialog id="menu"><h2>Dockに追加</h2><button id="app">📱　アプリ（ショートカット）</button><button id="documents">📁　書類フォルダ</button><button class="close" id="close">キャンセル</button><p class="hint">デザイン確認用です。設定は保存されません。</p></dialog>
<script>
const menu=document.getElementById('menu'),dock=document.getElementById('dock'),toggle=document.getElementById('toggle');let example=true;
function item(icon,label,action){const button=document.createElement('button');button.className='dock-item';const span=document.createElement('span');span.className='dock-icon';span.textContent=icon;const text=document.createElement('span');text.textContent=label;button.append(span,text);button.addEventListener('click',action);dock.append(button)}
function render(){dock.replaceChildren();if(example){item('📁','書類',()=>alert('デザイン見本：書類フォルダ'));item('✈️','ANA',()=>alert('デザイン見本：ANA'));item('🏨','Hilton',()=>alert('デザイン見本：Hilton'))}item('+','追加',()=>menu.showModal());toggle.textContent=example?'未登録の表示を見る':'登録済みの表示を見る'}
toggle.addEventListener('click',()=>{example=!example;render()});document.getElementById('close').onclick=()=>menu.close();document.getElementById('app').onclick=()=>{menu.close();alert('登録画面の構成は次に確認します')};document.getElementById('documents').onclick=()=>{menu.close();alert('書類フォルダ登録画面の構成は次に確認します')};render();
</script></body></html>
