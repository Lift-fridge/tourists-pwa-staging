<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dock V1.1 表紙デザイン確認</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#2a2925;background:#e9e8e2}*{box-sizing:border-box}body{margin:0}.preview{max-width:440px;margin:0 auto;height:100svh;min-height:580px;position:relative;background:#f6f6f4 url('../assets/mobile-cover.png') center/cover no-repeat;overflow:hidden}.preview:before{content:"";position:absolute;inset:0;background:rgba(246,246,244,.88)}.contents{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:34px 28px 28px}.brand{text-align:center;font-size:11px;font-weight:600;letter-spacing:.18em;color:#716d65}.center{display:contents}.trip{position:absolute;top:37%;left:18px;right:18px;transform:translateY(-50%);text-align:center}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(34px,10vw,46px);line-height:1.32;margin:0}.destination{font-size:12px;letter-spacing:.22em;color:#716d65;margin:15px 0 0}.dates{font-size:14px;margin:21px 0 0}.dock{position:absolute;top:66.666%;left:20px;right:20px;transform:translateY(-50%);display:flex;justify-content:center;gap:4px;align-items:flex-start;overflow-x:auto;overscroll-behavior-x:contain;padding:6px 0 12px;scrollbar-width:thin}.dock.many{justify-content:flex-start}.dock-item{scroll-snap-align:start}.dock{scroll-snap-type:x proximity;--slot:calc((100% - 12px)/4)}.dock.peek{--slot:calc((100% - 16px)/4.65)}.dock .dock-item{width:var(--slot);min-width:var(--slot);flex:0 0 var(--slot)}.dock .dock-icon{width:min(68px,calc(var(--slot) - 4px));height:min(68px,calc(var(--slot) - 4px));border-radius:19px;font-size:30px}.dock-item{border:0;background:none;display:grid;justify-items:center;gap:6px;width:78px;min-width:78px;flex:0 0 78px;color:#4d5548;font-size:11px;cursor:pointer}.dock-label{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}.dock-icon{display:grid;place-items:center;width:58px;height:58px;border-radius:17px;border:1px solid rgba(106,120,100,.34);background:rgba(255,255,255,.46);font-size:27px}.footer{text-align:center;color:#716d65;font-size:12px}.footer .ornament{display:block;color:#587d5a;font-size:16px}dialog{width:min(94vw,385px);border:1px solid #d6d6d1;border-radius:16px;padding:20px;background:#fafaf9;color:#2a2925;box-shadow:0 18px 65px #0004}dialog::backdrop{background:#0005}dialog h2{margin:0 0 18px;font-size:17px}dialog button{display:block;width:100%;text-align:left;margin:9px 0;background:white;border:1px solid #d6d6d1;border-radius:10px;padding:15px;font-size:15px}dialog button.close{text-align:center;background:#eee}.hint{font-size:12px;color:#716d65;line-height:1.6;margin-bottom:0}.compare{position:absolute;top:67px;left:12px;z-index:2;font-size:11px;background:#ffffffdd;border:1px solid #bcb8ae;padding:5px;border-radius:10px}.compare select{display:block;font-size:12px;max-width:186px;border:0;background:transparent;color:#444}.toggle{position:absolute;top:67px;right:12px;z-index:2;font-size:12px;padding:8px;border:1px solid #bcb8ae;border-radius:10px;background:#ffffffdd;color:#444;max-width:150px}
</style></head><body>
<main class="preview"><label class="compare" for="layout">並び方 <select id="layout"><option value="four">A：4列の大きさ</option><option value="peek">B：5個目を少し見せる</option></select></label><select class="toggle" id="toggle" aria-label="登録数"><option value="0">未登録</option><option value="3">3個</option><option value="6" selected>6個</option><option value="10">10個</option><option value="names">長い名前</option></select><div class="contents"><div class="brand">旅のしおり</div><div class="center"><div class="trip"><h1>ロンドン旅行</h1><p class="destination">LONDON</p><p class="dates">2027.05.01 — 2027.05.06</p></div><nav class="dock" id="dock"></nav></div><div class="footer"><span class="ornament">♧</span>↑ 上へスワイプして旅をはじめる</div></div></main>
<dialog id="menu"><h2>Dockに追加</h2><button id="app">📱　アプリ（ショートカット）</button><button id="documents">📁　書類フォルダ</button><button class="close" id="close">キャンセル</button><p class="hint">デザイン確認用です。設定は保存されません。</p></dialog>
<script>
const menu=document.getElementById('menu'),dock=document.getElementById('dock'),toggle=document.getElementById('toggle'),layout=document.getElementById('layout');let count='6';const examples=[['📁','書類'],['✈️','ANA'],['🏨','Hilton'],['🚆','鉄道'],['🛂','ESTA'],['🚌','バス'],['🗺️','地図'],['🎟️','予約'],['🚕','配車'],['📱','現地SIM']];const longExamples=[['✈️','British Airways'],['🚄','新幹線時刻表'],['🛫','AlaskaHawaiian'],['🎬','エンターテイメント']];
function item(icon,label,action){const button=document.createElement('button');button.className='dock-item';const span=document.createElement('span');span.className='dock-icon';span.textContent=icon;const text=document.createElement('span');text.textContent=label;text.className='dock-label';text.title=label;button.append(span,text);button.addEventListener('click',action);dock.append(button)}
function render(){dock.replaceChildren();const list=count==='names'?longExamples:examples.slice(0,Number(count));for(const [icon,label] of list){item(icon,label,()=>alert('登録名：'+label))}item('+','追加',()=>menu.showModal());dock.classList.toggle('many',list.length+1>4);dock.classList.toggle('peek',layout.value==='peek');toggle.value=count;dock.scrollLeft=0}
toggle.addEventListener('change',()=>{count=toggle.value;render()});layout.addEventListener('change',render);document.getElementById('close').onclick=()=>menu.close();document.getElementById('app').onclick=()=>{menu.close();alert('登録画面の構成は次に確認します')};document.getElementById('documents').onclick=()=>{menu.close();alert('書類フォルダ登録画面の構成は次に確認します')};render();
</script></body></html>
